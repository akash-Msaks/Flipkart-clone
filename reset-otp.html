<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
     <link
    rel="icon"
    type="image/png"
    href="./icons/shopKart.png"
>

    <title>Verify OTP | ShopKart</title>

    <link
        rel="stylesheet"
        href="./Css/reset-otp.css"
    >

</head>

<body>

    <div class="reset-otp-container">

        <h1>Verify OTP 🔐</h1>

        <p>
            We sent a password reset OTP to:
        </p>

        <p id="resetEmail">
            Loading...
        </p>


        <form id="resetOtpForm">

            <div class="input-box">

                <label>
                    Enter OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                >

            </div>


            <button
                type="submit"
                class="verify-btn"
            >
                VERIFY OTP
            </button>

        </form>


        <button
            type="button"
            id="resendBtn"
            class="resend-btn"
        >
            Resend OTP
        </button>


        <a
            href="login.html"
            class="back-login"
        >
            Back to Login
        </a>

    </div>


    <script src="./javascript/reset-otp.js"></script>

</body>

</html>
