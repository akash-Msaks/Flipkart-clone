<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
     <link
    rel="icon"
    type="image/png"
    href="./icons/shopKart.png"
>
    <title>Forgot Password | ShopKart</title>

    <link
        rel="stylesheet"
        href="./Css/forgot-password.css"
    >

</head>

<body>

    <div class="forgot-container">

        <h1>Forgot Password 🔐</h1>

        <p>
            Enter your registered email address.
            We'll send you an OTP to verify your identity.
        </p>

        <form id="forgotPasswordForm">

            <div class="input-box">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <button
                type="submit"
                class="forgot-btn"
            >
                SEND OTP
            </button>

        </form>

        <a href="login.html">
            Back to Login
        </a>

    </div>


    <script src="./javascript/forgot-password.js"></script>

</body>

</html>
