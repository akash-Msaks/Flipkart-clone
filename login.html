<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Flipkart Clone</title>
      <link
    rel="icon"
    type="image/png"
    href="./icons/shopKart.png"
>
    <link rel="stylesheet" href="./Css/login.css">
</head>

<body>

<div class="login-container">

    <!-- LEFT SIDE -->

    <div class="login-left">

        <h1>Login</h1>

        <p>
            Get access to your Orders,
            Wishlist and Cart.
        </p>

        <!-- <img src="./images/login.png" alt="Login Image"> -->

    </div>

    <!-- RIGHT SIDE -->

    <div class="login-right">

        <form id="loginForm">

            <h2>Welcome Back 👋</h2>

            <div class="input-box">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your Email"
                    required
                >

            </div>

            <div class="input-box">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your Password"
                    required
                >

            </div>

            <div class="options">

                <label>

                    <input type="checkbox" id="showPassword">

                    Show Password

                </label>

                <a href="forgot-password.html">
    Forgot Password?
</a>

            </div>

            <button type="submit" class="login-btn">

                LOGIN

            </button>

            <p class="signup-link">

                New to Flipkart?

                <a href="signup.html">

                    Create an Account

                </a>

            </p>

        </form>

    </div>

</div>

<script src="./javascript/login.js"></script>

</body>
</html>
