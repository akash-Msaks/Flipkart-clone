<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
     <link
    rel="icon"
    type="image/png"
    href="./icons/shopKart.png"
>

    <title>Reset Password | ShopKart</title>

    <link
        rel="stylesheet"
        href="./Css/reset-password.css"
    >

</head>

<body>

    <div class="reset-container">

        <h1>Reset Password 🔐</h1>

        <p>
            Create a new password for your account.
        </p>

        <form id="resetPasswordForm">

            <div class="input-box">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>


            <div class="input-box">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
            >
                RESET PASSWORD
            </button>

        </form>

    </div>


    <script src="./javascript/reset-password.js"></script>

</body>

</html>
